name: contribution gate

on:
  pull_request:
    paths:
      - src/prefect/cli/automation.py
      - tests/events/client/cli/test_automations.py
      - scripts/contribution_gate.py
      - .github/workflows/contribution-gate.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  contribution-gate:
    name: contribution gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install the project
        run: uv sync --locked

      - name: Run the contribution gate
        run: python3 scripts/contribution_gate.py "origin/${{ github.base_ref }}"
