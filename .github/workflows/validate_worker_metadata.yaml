name: Ensure JSON views are valid on PR
on:
  # Demo fork: automatic CI disabled. PRs use contribution-gate.yml instead.
  # Re-enable upstream triggers when syncing back to PrefectHQ/prefect.
  workflow_dispatch:

jobs:
  submit-update-pr:
    name: Run JSON schema validation against all views
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastjsonschema==2.19.1

      - name: Run JSON schema validation
        run: |
          python scripts/validate_collection_view_content.py
