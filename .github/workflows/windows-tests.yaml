name: Windows Tests

on:
  # Demo fork: automatic CI disabled. PRs use contribution-gate.yml instead.
  # Re-enable upstream triggers when syncing back to PrefectHQ/prefect.
  workflow_dispatch:

permissions: {}

jobs:
  run-tests-sqlite:
    name: Test with SQLite

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.15"

      fail-fast: true

    permissions:
      contents: read

    runs-on: windows-latest
    timeout-minutes: 10

    env:
      # enable colored output
      PY_COLORS: 1

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: "pyproject.toml"

      - name: Run Windows-specific tests
        run: |
          # Only run tests marked with @pytest.mark.windows
          uv run pytest tests -vv -m windows --durations=25

      - name: Run filesystem contract tests
        run: |
          uv run pytest tests/utilities/test_filesystem.py::TestFilterFiles tests/test_filesystems.py -k "TestFilterFiles or nested_ignored_files" -vv --durations=25

      - name: Run futures tests
        run: |
          # Run the complete futures module on Windows for full coverage of
          # as_completed / PrefectFutureList timeout behavior.
          uv run pytest tests/test_futures.py -vv --durations=25

  test-unc-paths:
    name: Test Windows UNC Paths
    # Only run this job when triggered manually
    if: github.event_name == 'workflow_dispatch'

    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: "pyproject.toml"

      - name: Create test UNC path and run flow
        shell: pwsh
        run: |
          # Create a test directory
          New-Item -ItemType Directory -Path "C:\ShareTest" -Force

          # Create network share
          New-SmbShare -Name "PrefectTest" -Path "C:\ShareTest" -FullAccess "Everyone"

          # Run the test script from the current directory
          uv run scripts/test_unc_paths.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Remove-SmbShare -Name "PrefectTest" -Force
