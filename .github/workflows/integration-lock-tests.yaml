name: Integration lock automation tests
on:
  # Demo fork: automatic CI disabled. PRs use contribution-gate.yml instead.
  # Re-enable upstream triggers when syncing back to PrefectHQ/prefect.
  workflow_dispatch:

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run --no-project --with packaging --with pyyaml python -m unittest discover -s scripts/tests -p test_update_uv_lock_integrations.py
